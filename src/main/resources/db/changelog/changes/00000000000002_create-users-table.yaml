databaseChangeLog:
  - changeSet:
      id: 2
      author: gabriel
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: login
                  type: varchar(120)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_update
                  type: timestamp
              - column:
                  name: address_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_users_address
                    references: address(id)
